{% set name = "deferrer" %}
{% set version = "1.1.0" %}
{% set python_min = "3.11" %}
{% set python_max = "3.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/deferrer-{{ version }}.tar.gz
  sha256: 5dc87882b6bdaac1eb1ae39155f62f4a47a168f3fd8c460c96bcc3347c2f38ab

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }} <={{ python_max }}

test:
  imports:
    - deferrer
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/Azureblade3808/py-deferrer
  summary: Fancy `defer` for Python >= 3.12 (partially supported in Python 3.11)
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Azureblade3808
