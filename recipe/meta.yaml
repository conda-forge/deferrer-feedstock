{% set name = "deferrer" %}
{% set version = "1.1.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/deferrer-{{ version }}.tar.gz
  sha256: 3d0bac048c9ccee6e3e9b82bc18dec6337d004a9e32cbdd0c4fb68b23d1d5d0a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - deferrer
  commands:
    - pip check
  requires:
    - python >={{ python_min }}
    - pip

about:
  home: https://github.com/Azureblade3808/py-deferrer
  summary: Fancy `defer` for Python >= 3.12 (partially supported in Python 3.11)
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Azureblade3808
